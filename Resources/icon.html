<!doctype html>
<meta charset="utf-8">
<title>Porterage icon</title>
<!--
  The source for Resources/Porterage.icns, rendered by Scripts/make-icon.sh.

  The mark is a meter: three cells of a rising scale, two reached and the third not. It is the one
  shape that survives 16 px, and it is the same mark the website carries in its toolbar, so the app
  in the Dock and the site in a tab read as one product.

  Redrawn 17 Sep 2026, when the site was rebuilt in macOS's own idiom. The old plate was a brushed
  metal faceplate with a hard 4 px edge — a nineties instrument. This one is lit the way current
  macOS icons are lit: one soft light from above, a cool graphite body, a hairline rim that catches
  that light along the top only, and the amber throwing its own glow onto the plate beneath it.
  Nothing is textured; the depth is all gradient and shadow.

  1024 canvas with the plate at 824, the proportion Apple's icon grid uses, so the plate sits at the
  same size as every other icon in the Dock.
-->
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }

  .plate {
    position: absolute; left: 100px; top: 100px; width: 824px; height: 824px;
    border-radius: 185px;
    /* Cool graphite, lightest at the top where the light falls, deepest in the lower third. */
    background: linear-gradient(176deg, #333741 0%, #23262c 34%, #171a1e 68%, #101215 100%);
    box-shadow:
      /* the icon's own drop, the way macOS lights the Dock */
      0 30px 64px rgba(0, 0, 0, .46),
      0 8px 18px rgba(0, 0, 0, .32),
      /* a rim that catches the light along the top edge and fades before the sides */
      inset 0 2px 0 rgba(255, 255, 255, .13),
      inset 0 0 0 1.5px rgba(255, 255, 255, .055),
      inset 0 -2px 0 rgba(0, 0, 0, .40);
    overflow: hidden;
  }

  /* The light itself: a wide soft pool in the upper third, not a stripe. */
  .plate::before {
    content: ""; position: absolute; left: -10%; top: -32%; width: 120%; height: 78%;
    background: radial-gradient(60% 52% at 50% 50%, rgba(255, 255, 255, .085), rgba(255, 255, 255, 0) 70%);
  }

  /* What the lit cells throw back onto the plate. Without this the bars look printed on. */
  .plate::after {
    content: ""; position: absolute; left: 6%; bottom: -14%; width: 88%; height: 62%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(240, 160, 39, .20), rgba(240, 160, 39, 0) 72%);
  }

  .cells {
    position: absolute; left: 172px; top: 214px; width: 480px; height: 396px;
    display: flex; gap: 60px; align-items: flex-end;
  }
  .cell { width: 120px; border-radius: 30px; position: relative; }
  .cell:nth-child(1) { height: 190px; }
  .cell:nth-child(2) { height: 285px; }
  .cell:nth-child(3) { height: 396px; }

  .cell--lit {
    background: linear-gradient(180deg, #ffd08a 0%, #ffb23f 30%, #ef9d1c 62%, #cd7c05 100%);
    box-shadow:
      0 0 70px rgba(255, 170, 40, .40),
      0 10px 22px rgba(0, 0, 0, .30),
      inset 0 2px 0 rgba(255, 255, 255, .42),
      inset 0 -4px 0 rgba(120, 62, 0, .28);
  }

  /* The step the meter has not reached: the same cell, unlit, still visibly a cell. */
  .cell--dark {
    background: linear-gradient(180deg, rgba(255, 176, 62, .085), rgba(255, 176, 62, .035));
    box-shadow:
      inset 0 0 0 3px rgba(255, 176, 62, .16),
      inset 0 2px 0 rgba(255, 255, 255, .05);
  }
</style>
<div class="plate">
  <div class="cells">
    <div class="cell cell--lit"></div>
    <div class="cell cell--lit"></div>
    <div class="cell cell--dark"></div>
  </div>
</div>
